name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polyflow
          POSTGRES_PASSWORD: polyflow
          POSTGRES_DB: polyflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polyflow" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POLYFLOW_DATABASE_URL: postgresql+asyncpg://polyflow:polyflow@localhost:5432/polyflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrations round-trip and match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed sample data
        run: |
          uv run python -m app.cli seed-lexicon data/lexicon/*.csv
          uv run python -m app.cli seed-blacklist data/blacklist/*.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -f docker/backend/Dockerfile --target api backend
      - run: docker build -f docker/backend/Dockerfile --target worker backend
      - run: docker build -f docker/frontend/Dockerfile --target runner frontend
